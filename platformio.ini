; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = RTM test stand Display and Motor controllers code

[env:clearcore]
platform = https://github.com/patrickwasp/platform-atmelsam
board = clearcore
framework = arduino
; Phase 5 cutover: UDP is the production transport. The TTL branches in
; ClearCoreRTM.h / ExpansionBoard.h / TTLComms.cpp are kept under
; #if !RTM_LINK_ETHERNET as a fallback escape hatch only — set to 0 to
; rebuild against the legacy Serial1 / ConnectorCOM1 path.
build_flags = -DRTM_LINK_ETHERNET=1
build_src_filter = +<*> - <.git/> -<.vscode/> -<exp-board> -<exp-board-nettest/> -<test/> -<tools/> -<sniffer/> -<clearcore-nettest/>
upload_port = COM8

; -----------------------------------------------------------------------------
; Phase 3 ClearCore Ethernet bring-up env. Compiles ONLY src/clearcore-nettest/
; against the same toolchain as [env:clearcore]. Uses the built-in Teknic
; Ethernet stack (no extra lib_deps). Static IP 10.0.0.10, UDP port 8888.
; -----------------------------------------------------------------------------
[env:clearcore-nettest]
extends = env:clearcore
build_src_filter = -<*> +<clearcore-nettest/*.cpp>
upload_port = COM8

[env:XPB]
platform = atmelmegaavr
board = nano_every
framework = arduino
lib_deps = 
	adafruit/Adafruit MAX31855 library@^1.4.2
	pfeerick/elapsedMillis @ ^1.0.6
	br3ttb/PID@^1.2.1
	thomasfredericks/Bounce2@^2.72
	arduino-libraries/SD@^1.3.0
	; Ethernet3 is vendored under lib/Ethernet3 with a local patch that
	; stubs the unused beginPacket(const char*, port) DNS overload to free
	; ~1.7 KB of flash on the Nano Every (Phase 5). Do NOT re-add the
	; sstaub/Ethernet3 lib_dep here — doing so will pull the unpatched
	; copy and blow the flash budget under RTM_LINK_ETHERNET=1.
; Phase 5 cutover: UDP is the production transport. The TTL branches in
; ClearCoreRTM.h / ExpansionBoard.h / TTLComms.cpp are kept under
; #if !RTM_LINK_ETHERNET as a fallback escape hatch only — set to 0 to
; rebuild against the legacy Serial1 / ConnectorCOM1 path.
build_flags = -flto -ffunction-sections -fdata-sections -Wl,--gc-sections -DXPB_DEBUG=0 -DRTM_LINK_ETHERNET=1
build_src_filter = +<*> - <.git/> -<.vscode/> -<clearcore/> -<clearcore-nettest/> -<test/> -<tools/> -<sniffer/> -<exp-board-nettest/>
upload_port = COM9

; -----------------------------------------------------------------------------
; Phase 2.0 flash-budget measurement env. Compiles ONLY src/exp-board-nettest/
; against the same toolchain/flags as [env:XPB], plus arduino Ethernet.
; Used to measure UDP-only Ethernet library flash cost before committing.
; -----------------------------------------------------------------------------
[env:XPB-nettest]
extends = env:XPB
lib_deps =
	; Ethernet3 is vendored under lib/Ethernet3 (see [env:XPB]).
build_src_filter = -<*> +<exp-board-nettest/*.cpp> +<exp-board/LCDDriver.cpp>
upload_port = COM9

[env:ttl-sniffer]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 460800
upload_protocol = teensy-cli
build_src_filter =
  -<*>
  +<sniffer/*.cpp>
  +<sniffer/*.c>
