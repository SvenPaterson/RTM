; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = RTM test stand Display and Motor controllers code

[env:clearcore]
platform = https://github.com/patrickwasp/platform-atmelsam
board = clearcore
framework = arduino
build_src_filter = +<*> - <.git/> -<.vscode/> -<exp-board> -<test/> -<tools/> -<sniffer/> -<clearcore-nettest/>
upload_port = COM8

; -----------------------------------------------------------------------------
; Phase 3 ClearCore Ethernet bring-up env. Compiles ONLY src/clearcore-nettest/
; against the same toolchain as [env:clearcore]. Uses the built-in Teknic
; Ethernet stack (no extra lib_deps). Static IP 10.0.0.10, UDP port 8888.
; -----------------------------------------------------------------------------
[env:clearcore-nettest]
extends = env:clearcore
build_src_filter = -<*> +<clearcore-nettest/*.cpp>
upload_port = COM8

[env:exp-board]
platform = atmelmegaavr
board = nano_every
framework = arduino
lib_deps = 
	adafruit/Adafruit MAX31855 library@^1.4.2
	pfeerick/elapsedMillis @ ^1.0.6
	br3ttb/PID@^1.2.1
	thomasfredericks/Bounce2@^2.72
	arduino-libraries/SD@^1.3.0
build_flags = -flto -DXPB_DEBUG=0
build_src_filter = +<*> - <.git/> -<.vscode/> -<clearcore/> -<test/> -<tools/> -<sniffer/> -<exp-board-nettest/>
upload_port = COM9

; -----------------------------------------------------------------------------
; Phase 2.0 flash-budget measurement env. Compiles ONLY src/exp-board-nettest/
; against the same toolchain/flags as [env:exp-board], plus arduino Ethernet.
; Used to measure UDP-only Ethernet library flash cost before committing.
; -----------------------------------------------------------------------------
[env:exp-board-nettest]
extends = env:exp-board
lib_deps =
	sstaub/Ethernet3@^1.5.5
build_src_filter = -<*> +<exp-board-nettest/*.cpp> +<exp-board/LCDDriver.cpp>
upload_port = COM9

[env:ttl-sniffer]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 460800
upload_protocol = teensy-cli
build_src_filter =
  -<*>
  +<sniffer/*.cpp>
  +<sniffer/*.c>
