; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = RTM test stand Display and Motor controllers code

[env:clearcore]
platform = https://github.com/patrickwasp/platform-atmelsam
board = clearcore
framework = arduino
build_src_filter = +<*> - <.git/> -<.vscode/> -<exp-board> -<rig-controller> -<test/> -<tools/> -<clearcore/cc_debug.cpp>
upload_port = COM8
lib_deps = 
	br3ttb/PID@^1.2.1

; CC_DEBUG -- minimal sender-side ground-truth image. Only cc_debug.cpp is
; compiled; no motor, no RtmComms, no protocol. See cc_debug.cpp header
; comment and /memories/session/plan.md Phase G for purpose and gates.
[env:CC_DEBUG]
platform = https://github.com/patrickwasp/platform-atmelsam
board = clearcore
framework = arduino
build_src_filter =
	-<*>
	+<clearcore/cc_debug.cpp>
upload_port = COM8

[env:XPB]
platform = atmelmegaavr
board = nano_every
framework = arduino
lib_deps = 
	pfeerick/elapsedMillis @ ^1.0.6
	arduino-libraries/SD@^1.3.0
	; Ethernet3 is vendored under lib/Ethernet3 with a local patch that
	; stubs the unused beginPacket(const char*, port) DNS overload to free
	; ~1.7 KB of flash on the Nano Every. Do NOT re-add the
	; sstaub/Ethernet3 lib_dep here — doing so will pull the unpatched
	; copy and blow the flash budget.
build_flags = -flto -ffunction-sections -fdata-sections -Wl,--gc-sections -DXPB_DEBUG=0 -DRTM_W5500_SPI_HZ=2000000UL
build_src_filter = +<*> - <.git/> -<.vscode/> -<clearcore/> -<rig-controller/> -<test/> -<tools/> -<exp-board/*_debug.cpp>
upload_port = COM9

; XPB_PROD_TRACE -- production XPB code path with serial diagnostics enabled.
; Use this for bench debugging when CC reports "waiting for protocol from XPB".
[env:XPB_PROD_TRACE]
platform = atmelmegaavr
board = nano_every
framework = arduino
lib_deps =
	pfeerick/elapsedMillis @ ^1.0.6
	arduino-libraries/SD@^1.3.0
build_flags = -flto -ffunction-sections -fdata-sections -Wl,--gc-sections -DXPB_DEBUG=0 -DXPB_PROTO_TRACE=1 -DRTM_W5500_SPI_HZ=2000000UL
build_src_filter = +<*> - <.git/> -<.vscode/> -<clearcore/> -<rig-controller/> -<test/> -<tools/> -<exp-board/*_debug.cpp>
upload_port = COM9

[env:XPB_DEBUG]
platform = atmelmegaavr
board = nano_every
framework = arduino
build_flags = -flto -ffunction-sections -fdata-sections -Wl,--gc-sections -DXPB_DEBUG=1 -DRTM_W5500_SPI_HZ=2000000UL
build_src_filter =
	-<*>
	+<exp-board/xpb_debug.cpp>
upload_port = COM9

[env:rig-controller]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 460800
upload_protocol = teensy-cli
build_src_filter =
  -<*>
  +<rig-controller/*.cpp>
  +<rig-controller/*.c>
