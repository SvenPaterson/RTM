[pytest]
# Scenarios live under test/scenarios/. Each file maps 1:1 to a behavior
# we want to keep alive — keep the suite small, named, and runnable.
#
# Discovery & layout
testpaths = test/scenarios
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = -ra -v --strict-markers
console_output_style = count

# Logging — every run writes a CSV-friendly file log alongside stdout.
# Path is set dynamically by the conftest hook (see test/conftest.py)
# so the filename includes a timestamp; these flags configure format.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-7s] %(message)s
log_cli_date_format = %H:%M:%S
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)-7s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%dT%H:%M:%S

# Custom markers
#   manual        — requires a human-in-the-loop step (e.g. unplug the
#                   switch). CI / smoke runs should `-m "not manual"`.
#   slow          — nominal duration > 30s. Excluded from quick passes.
#   live_rig      — depends on physical CC + XPB powered up and on the
#                   isolated 10.0.0.0/24 LAN with PC at 10.0.0.100.
markers =
    manual: requires operator interaction (unplug, button press, SD swap)
    slow: nominal duration > 30s
    live_rig: requires powered CC + XPB on the isolated rig LAN
